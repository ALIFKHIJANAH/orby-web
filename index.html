<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orby · A Dynamic Island for your AI coding agents</title>
    <meta
      name="description"
      content="Orby lives in your MacBook's notch and shows what Claude Code, Codex and six more agents are doing. Approve requests and track limits without leaving your editor."
    />
    <meta property="og:title" content="Orby · Every agent. One little orb." />
    <meta property="og:description" content="See what your agents are doing, approve requests and track limits from your Mac's notch." />
    <meta property="og:image" content="/app-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('orby-theme')
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
